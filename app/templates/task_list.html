{% extends "base.html" %}

{% block title %}任务列表 - 课映{% endblock %}

{% block content %}
<div class="page-header">
    <div class="d-flex justify-content-between align-items-center">
        <h2><i class="bi bi-list-task"></i> 任务列表</h2>
        <div>
            <button class="btn btn-outline-secondary me-2 js-config-sk" onclick="configSK()">
                <i class="bi bi-key"></i> <span class="sk-btn-text">配置 SK</span>
            </button>
            <button class="btn btn-primary" onclick="goToCreate()">
                <i class="bi bi-plus-lg"></i> 新建任务
            </button>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <!-- 搜索栏 -->
        <div class="row mb-3">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="form-control" id="searchInput" placeholder="搜索任务名称..."
                           onkeyup="if (event.key === 'Enter') searchTasks()">
                    <button class="btn btn-outline-primary" onclick="searchTasks()">
                        <i class="bi bi-search"></i> 搜索
                    </button>
                    <button class="btn btn-outline-secondary" id="clearSearchBtn" style="display:none" onclick="clearSearch()">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-striped" id="taskTable">
                <thead>
                    <tr>
                        <th>任务名称</th>
                        <th>状态</th>
                        <th>任务ID</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody">
                    <tr id="loadingRow">
                        <td colspan="5" class="text-center text-muted py-4">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <nav class="mt-3">
            <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
    </div>
</div>

<!-- 配置 SK 弹窗 -->
{% include "partials/sk_modal.html" %}

<!-- 删除确认弹窗 -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title text-danger"><i class="bi bi-exclamation-triangle-fill"></i> 确认删除</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-0">确定要删除该任务吗？<br><strong class="text-danger">此操作不可恢复！</strong></p>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="deleteConfirmBtn" onclick="confirmDelete()">确定删除</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/task_list.js?v={{ static_v }}"></script>
{% endblock %}
